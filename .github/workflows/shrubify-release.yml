name: Shrubify - Watch, Build, Release and Update Source

on:
  schedule:
    # Spotify version check twice daily (GitHub may delay scheduled runs).
    - cron: '23 7,19 * * *'
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct HTTPS URL of a Spotify IPA you may modify (optional; overrides catalog)'
        required: false
        type: string
      force_release:
        description: 'Publish another revision even if the same source/Spotify version already exists'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - Master
    paths:
      - 'Sources/**'
      - 'Scripts/**'
      - 'Tools/**'
      - 'modules/**'
      - 'layout/**'
      - 'Assets/**'
      - 'config/ipa-sources.json'
      - 'scripts/**'
      - 'Makefile'
      - 'control'
      - '.github/workflows/shrubify-release.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: shrubify-release-main
  cancel-in-progress: false

jobs:
  plan:
    name: Check Spotify updates and source catalog
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      expected_version: ${{ steps.check.outputs.expected_version }}
      reason: ${{ steps.check.outputs.reason }}
      needs_ipa: ${{ steps.check.outputs.needs_ipa }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find current Spotify version and matching user-supplied IPA
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_IPA: ${{ inputs.ipa_url }}
          CATALOG_URL: ${{ secrets.SPOTIFY_IPA_CATALOG_URL }}
          FALLBACK_IPA: ${{ secrets.SPOTIFY_IPA_URL }}
          PUBLIC_RELEASE: ${{ vars.ALLOW_PUBLIC_IPA_RELEASE }}
        run: |
          TWEAK_VERSION=$(awk '$1=="Version:"{print $2}' control)
          SOURCE_SHA=$(git log -1 --format=%H -- Sources Scripts Tools modules layout Assets config scripts Makefile control .github/workflows/shrubify-release.yml)
          python3 scripts/plan_release.py \
            --repo "$GITHUB_REPOSITORY" --sha "$SOURCE_SHA" \
            --tweak "$TWEAK_VERSION" \
            --manual-url "$MANUAL_IPA" --catalog-url "$CATALOG_URL" \
            --fallback-url "$FALLBACK_IPA" \
            --token "$GITHUB_TOKEN" --event "$GITHUB_EVENT_NAME" \
            --public-release "${PUBLIC_RELEASE:-false}"
      - name: Create one tracking issue if a new Spotify IPA is needed
        if: ${{ steps.check.outputs.build == 'false' && steps.check.outputs.needs_ipa == 'true' && vars.ALLOW_PUBLIC_IPA_RELEASE == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.latest_version }}
        run: |
          title="Spotify ${VERSION} - source IPA required"
          if ! gh issue list --state all --limit 200 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" \
              --body "Spotify ${VERSION} was detected. Supply a matching, authorized IPA URL in config/ipa-sources.json or your private catalog. The build will run automatically once an IPA is available. No IPA is sourced or decrypted by this workflow."
          fi

  build:
    name: Compile Shrubify and inject selected Spotify IPA
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SWIFTPROTOBUF_VERSION: '1.29.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate Shrubify source BEFORE downloading IPA or installing dependencies
        run: |
          set -euo pipefail
          bash -n scripts/build_shrubify.sh
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check_ios14_swiftui.py
          python3 scripts/check_shrubify_branding.py
          swiftc -frontend -parse Sources/EeveeSpotify/Shrubify3/*.swift
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - name: Resolve authorized IPA URL on this runner (keep secrets out of job outputs)
        env:
          MANUAL_IPA: ${{ inputs.ipa_url }}
          CATALOG_URL: ${{ secrets.SPOTIFY_IPA_CATALOG_URL }}
          FALLBACK_IPA: ${{ secrets.SPOTIFY_IPA_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TWEAK_VERSION=$(awk '$1=="Version:"{print $2}' control)
          SOURCE_SHA=$(git log -1 --format=%H -- Sources Scripts Tools modules layout Assets config scripts Makefile control .github/workflows/shrubify-release.yml)
          python3 scripts/plan_release.py \
            --repo "$GITHUB_REPOSITORY" --sha "$SOURCE_SHA" \
            --tweak "$TWEAK_VERSION" \
            --manual-url "$MANUAL_IPA" --catalog-url "$CATALOG_URL" \
            --fallback-url "$FALLBACK_IPA" --token "$GH_TOKEN" \
            --event "$GITHUB_EVENT_NAME" --public-release 'true' \
            --url-file "$RUNNER_TEMP/shrubify-ipa-url"
      - name: Download the user-provided IPA
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.expected_version }}
        run: |
          IPA_URL="$(cat "$RUNNER_TEMP/shrubify-ipa-url")"
          curl -fL --retry 3 --connect-timeout 25 --max-time 900 \
            --output "$GITHUB_WORKSPACE/spotify.ipa" "$IPA_URL"
          python3 scripts/inspect_ipa.py spotify.ipa --expected "$EXPECTED_VERSION" --output "$GITHUB_OUTPUT"
        id: ipa
      - name: Derive reproducible release tag from actual Spotify Info.plist
        id: metadata
        run: |
          TWEAK_VERSION=$(awk '$1=="Version:"{print $2}' control)
          SOURCE_SHA=$(git log -1 --format=%H -- Sources Scripts Tools modules layout Assets config scripts Makefile control .github/workflows/shrubify-release.yml)
          SHA7="${SOURCE_SHA:0:7}"
          TAG="shrubify-s${SPOT_VERSION}-v${TWEAK_VERSION}-g${SHA7}"
          if [[ "$FORCE" == "true" ]]; then TAG="${TAG}-r${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tweak_version=$TWEAK_VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'already_exists=true' >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'already_exists=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOT_VERSION: ${{ steps.ipa.outputs.version }}
          FORCE: ${{ inputs.force_release }}
      # Calculate the hash once from tracked inputs BEFORE Makefile generates
      # Sources/EeveeSpotify/Generated/RepoSlug.swift. Using hashFiles(Sources/**)
      # twice would change the cache key after compilation and cause misses.
      - name: Fingerprint compiled tweak inputs
        if: ${{ steps.metadata.outputs.already_exists == 'false' }}
        id: compiled-inputs
        run: |
          set -euo pipefail
          HASH=$(git ls-files -z -- Sources Makefile control layout Tools modules Scripts Package.swift EeveeSpotify.plist scripts/build_shrubify.sh \
            | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')
          test -n "$HASH"
          echo "sha=$HASH" >> "$GITHUB_OUTPUT"
      # Same tweak and injector can be reused for multiple Spotify IPA updates.
      # Every compiled input (including package version) is part of the key.
      - name: Restore matching compiled tweak package and injector
        if: ${{ steps.metadata.outputs.already_exists == 'false' }}
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/com.shrubify.spotify_*.deb
            packages/zxPluginsInject.dylib
          key: shrubify-package-${{ runner.os }}-${{ runner.arch }}-xcode26.1.1-${{ steps.compiled-inputs.outputs.sha }}
      - name: Checkout Theos
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      # Theos uses .theos_build, not SwiftPM's default .build directory.
      # Hash immutable toolchain revisions and compiler identity BEFORE compilation:
      # SwiftPM may rewrite Package.resolved while building.
      - name: Fingerprint native build tools
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        id: native-tools
        run: |
          set -euo pipefail
          HASH=$({ swift --version; git -C theos rev-parse HEAD; git -C theos submodule status --recursive; } | shasum -a 256 | awk '{print $1}')
          echo "sha=$HASH" >> "$GITHUB_OUTPUT"
      - name: Restore Orion and Swift support toolchain cache
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        id: orion-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            theos/vendor/orion/.theos_build
            theos/vendor/swift-support/.theos_build
          key: shrubify-native-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-tools.outputs.sha }}
      # Compiling renamed SwiftProtobuf for arm64 and arm64e is expensive.
      # Cache its validated, complete framework between builds. Separate
      # restore/save steps ensure the cache is saved EVEN IF the tweak fails.
      - name: Restore SwiftProtobuf framework cache
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        id: proto-cache
        uses: actions/cache/restore@v4
        with:
          path: theos/lib/iphone/rootless/EeveeSwiftProtobuf.framework
          key: shrink-proto-${{ runner.os }}-${{ runner.arch }}-xcode26.1.1-ios14-1.29.0-${{ hashFiles('Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh') }}
      - name: Build SwiftProtobuf only on cache miss
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' && steps.proto-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          THEOS_PACKAGE_SCHEME=rootless bash Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          test -s "$THEOS/lib/iphone/rootless/EeveeSwiftProtobuf.framework/EeveeSwiftProtobuf"
          lipo -archs "$THEOS/lib/iphone/rootless/EeveeSwiftProtobuf.framework/EeveeSwiftProtobuf" | grep -q 'arm64e'
      - name: Save SwiftProtobuf framework cache immediately
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' && steps.proto-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: theos/lib/iphone/rootless/EeveeSwiftProtobuf.framework
          key: shrink-proto-${{ runner.os }}-${{ runner.arch }}-xcode26.1.1-ios14-1.29.0-${{ hashFiles('Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh') }}
      - name: Install build tools
        if: ${{ steps.metadata.outputs.already_exists == 'false' }}
        run: |
          if [[ "${{ steps.compiled-cache.outputs.cache-hit }}" == "true" ]]; then
            # The tweak and injector are already compiled; only dpkg extraction
            # and IPA injection are needed. Do not install build toolchains.
            if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi
          else
            brew install make dpkg ldid wget
            echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          fi
          python3 -m pip install --upgrade --break-system-packages \
            git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m)
          if [[ "$ARCH" == 'arm64' ]]; then SUFFIX='macos-arm64'; else SUFFIX='macos-amd64'; fi
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
            -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null
      - name: Compile tweak and inject IPA
        if: ${{ steps.metadata.outputs.already_exists == 'false' }}
        env:
          REPO_SLUG: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
          SHRUBIFY_PACKAGE_CACHE_HIT: ${{ steps.compiled-cache.outputs.cache-hit }}
        run: |
          # Keep the raw build log and summarize actual errors automatically.
          # Bash's exit code, not tee's, determines whether the build succeeded.
          set -o pipefail
          if bash scripts/build_shrubify.sh "$GITHUB_WORKSPACE/spotify.ipa" "$GITHUB_RUN_NUMBER" 2>&1 | tee "$RUNNER_TEMP/shrubify-full-build.log"; then
            echo 'Shrubify IPA build completed successfully.' >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/extract_build_errors.py "$RUNNER_TEMP/shrubify-full-build.log" --output Outputs/Shrubify-build-errors.txt
            {
              echo '## Shrubify build failed'
              echo 'The compiler errors are below and also attached as a text artifact.'
              echo '```text'
              head -90 Outputs/Shrubify-build-errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Save Orion toolchain cache after native compilation
        if: ${{ always() && steps.orion-cache.outcome == 'success' && steps.orion-cache.outputs.cache-hit != 'true' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            theos/vendor/orion/.theos_build
            theos/vendor/swift-support/.theos_build
          key: shrubify-native-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-tools.outputs.sha }}
      - name: Cache successfully compiled tweak for future Spotify IPA updates
        if: ${{ steps.metadata.outputs.already_exists == 'false' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            packages/com.shrubify.spotify_*.deb
            packages/zxPluginsInject.dylib
          key: shrubify-package-${{ runner.os }}-${{ runner.arch }}-xcode26.1.1-${{ steps.compiled-inputs.outputs.sha }}
      - name: Upload diagnostics if compilation fails
        if: ${{ failure() && steps.metadata.outputs.already_exists == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: Shrubify-Compiler-Errors-${{ github.run_number }}
          path: Outputs/Shrubify-build-errors.txt
          if-no-files-found: ignore
      - name: Upload build as private Actions artifact
        if: ${{ steps.metadata.outputs.already_exists == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: Shrubify-IPA-Spotify-${{ steps.ipa.outputs.version }}
          path: |
            Outputs/IPAS/*.ipa
            packages/com.shrubify.spotify_*.deb
          if-no-files-found: error
      - name: Publish public GitHub Release when authorized
        if: ${{ steps.metadata.outputs.already_exists == 'false' && vars.ALLOW_PUBLIC_IPA_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SPOTIFY_VERSION: ${{ steps.ipa.outputs.version }}
          TWEAK_VERSION: ${{ steps.metadata.outputs.tweak_version }}
        run: |
          IPA_PATH="$(cat Outputs/latest_ipa_path.txt)"
          DEB_PATH="$(cat Outputs/latest_deb_path.txt)"
          test -s "$IPA_PATH"
          cat > "$RUNNER_TEMP/shrubify-notes.md" <<EOF
          Shrubify by shrubbery and the ShrubHub team. Upstream contributors credited in the GPL source repository.

          - Spotify: ${SPOTIFY_VERSION}
          - Shrubify tweak: ${TWEAK_VERSION}
          - Shrubify Studio layouts, ShrubPanel quick access, local-only Replay and ShrubQueue shortcuts
          - Preserves Spotify's color palette; existing iOS 26 Liquid Glass hooks remain supported
          - Listening snapshots are not Spotify's actual playback queue
          - This is an automated build, NOT a device-verified compatibility certification.
          - You must sign the IPA with your own certificate.
          - Unofficial and not affiliated with Spotify.

          altstore-build: ${GITHUB_RUN_NUMBER}
          source-sha: ${GITHUB_SHA}
          EOF
          gh release create "$RELEASE_TAG" "$IPA_PATH" "$DEB_PATH" \
            --title "Shrubify ${TWEAK_VERSION} · Spotify ${SPOTIFY_VERSION}" \
            --notes-file "$RUNNER_TEMP/shrubify-notes.md" \
            --target "$GITHUB_SHA"
      - name: Regenerate AltStore repo.json from published releases
        if: ${{ vars.ALLOW_PUBLIC_IPA_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.repository.default_branch }}"
          # Compilation modifies files in the main checkout. Never rebase it.
          # Make a separate clean working tree for the AltStore source commit.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          SOURCE_TREE="${RUNNER_TEMP}/shrubify-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$SOURCE_TREE" "refs/remotes/origin/${BRANCH}"
          python3 "$SOURCE_TREE/scripts/generate_source.py" \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --branch "$BRANCH" --output "$SOURCE_TREE/docs/repo.json"
          git -C "$SOURCE_TREE" config user.name 'shrubify-release-bot'
          git -C "$SOURCE_TREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$SOURCE_TREE" add docs/repo.json
          if ! git -C "$SOURCE_TREE" diff --cached --quiet; then
            git -C "$SOURCE_TREE" commit -m "Update Shrubify AltStore source [skip ci]"
            git -C "$SOURCE_TREE" push origin "HEAD:$BRANCH"
          else
            echo 'AltStore source is already up to date.'
          fi
          git worktree remove "$SOURCE_TREE"
          echo "Source: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/docs/repo.json" >> "$GITHUB_STEP_SUMMARY"
